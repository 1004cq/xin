services:
  xin:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - xin-data:/data
    expose: ["8000"]
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  xin-data:
  caddy-data:
  caddy-config:
